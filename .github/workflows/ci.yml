name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Check, Build & Dist Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # astro check + build + check:dist (routes, sitemap, CSP meta, canonical,
      # external links in new tab, no placeholders).
      - name: Verify
        run: bun run verify
