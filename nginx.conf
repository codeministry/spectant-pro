server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Emit relative Location headers. Without this nginx builds absolute URLs
    # from the listen port and would redirect to http://<host>:8080/... behind
    # the ingress, leaking the internal port and downgrading to http.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/xhtml+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Astro's build output under /_astro is content-hashed, so it can be cached forever.
    location ^~ /_astro/ {
        # Single header on purpose: `expires` would emit a second Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed files from public/ (favicon, og.png, robots.txt) change rarely but can change.
    location ~* \.(png|svg|ico|txt|xml|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Every route is prerendered to a file; anything else is a real 404, no SPA fallback.
    # `$uri/` is deliberately omitted: it would 301 /de to /de/, adding a redirect hop to
    # every canonical URL. Canonical form is without a trailing slash.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
